name: Amazon RC1 verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python and Node (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned Python dependencies
        run: >-
          python -m pip install
          -r requirements-lock.txt
          -r requirements-verification.txt
          -r requirements-safety.txt
          -r integrations/alexa_mcp/requirements.txt
          pip-audit==2.10.1
      - name: Run full Python suite
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -rfEs 2>&1 | tee pytest.log
      - name: Publish pytest failures as annotations (diagnostic)
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("pytest.log").read_text(encoding="utf-8", errors="replace")
          start = max(text.find("= FAILURES ="), text.find("= ERRORS ="))
          body = text[start:] if start >= 0 else text[-20000:]
          chunks = [body[i:i + 3500] for i in range(0, len(body), 3500)][-9:]
          summary = [line for line in text.splitlines() if line.startswith(("FAILED", "ERROR"))]
          def emit(title, message):
              message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title={title}::{message}")
          emit("pytest summary", "\n".join(summary[:40] + text.splitlines()[-3:]))
          for index, chunk in enumerate(chunks, 1):
              emit(f"pytest detail {index}/{len(chunks)}", chunk)
          PY
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Run Node suite
        run: node --test tests/review_ui.test.cjs
      - name: Audit root Python dependencies
        run: python -m pip_audit -r requirements-lock.txt
      - name: Audit MCP Python dependencies
        run: python -m pip_audit -r integrations/alexa_mcp/requirements.txt

  history-secrets:
    name: Full-history secret scan (redacted)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install checksum-pinned Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir="$(mktemp -d "$RUNNER_TEMP/gitleaks.XXXXXX")"
          archive="$scanner_dir/gitleaks.tar.gz"
          curl --fail --location --retry 2 --output "$archive" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$scanner_dir" gitleaks
          "$scanner_dir/gitleaks" version
          echo "$scanner_dir" >> "$GITHUB_PATH"
      - name: Scan every reachable ref without printing secret values
        run: gitleaks git --redact=100 --no-banner --log-opts="--all" --gitleaks-ignore-path=.gitleaksignore .
