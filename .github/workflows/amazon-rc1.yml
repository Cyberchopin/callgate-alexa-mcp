name: Amazon RC1 verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python and Node (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned Python dependencies
        run: >-
          python -m pip install
          -r requirements-lock.txt
          -r requirements-verification.txt
          -r requirements-safety.txt
          -r integrations/alexa_mcp/requirements.txt
          pip-audit==2.10.1
      - name: Run full Python suite
        run: python -m pytest -q -rs
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Run Node suite
        run: node --test tests/review_ui.test.cjs
      - name: Audit root Python dependencies
        run: python -m pip_audit -r requirements-lock.txt
      - name: Audit MCP Python dependencies
        run: python -m pip_audit -r integrations/alexa_mcp/requirements.txt

  history-secrets:
    name: Full-history secret scan (redacted)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan every reachable ref without printing secret values
        run: >-
          docker run --rm
          -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:e4037a313035c932d6b14b934edc5da9bbf6212b52da0b94870e1448ed4b8e2b
          git --redact --no-banner --log-opts="--all" /repo
