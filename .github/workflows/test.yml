name: CallGate core tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -r requirements-verification.txt
      - run: python -m pip install -r requirements-safety.txt
      - run: python -m pip install -r integrations/alexa_mcp/requirements.txt
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/review_ui.test.cjs
      - run: python -m callgate.bench
      # Fail closed until every public numeric claim has an evidence binding.
      - run: python scripts/check_claims.py
