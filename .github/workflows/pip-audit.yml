name: Python dependency audit

on:
  push:
  pull_request:
  schedule:
    - cron: "23 9 * * 1"

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit -r requirements-lock.txt
      - run: python -m pip_audit -r integrations/alexa_mcp/requirements.txt
