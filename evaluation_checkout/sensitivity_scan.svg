<rect x="90" y="70" width="700" height="330" fill="#f8fafc" stroke="#cbd5e1"/>
<polyline points="90.0,400.0 265.0,306.5 440.0,227.3 615.0,151.4 790.0,70.0" fill="none" stroke="#7c3aed" stroke-width="3"/>
