[project]
name = "callgate"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "websockets>=14,<18", "networkx==3.4.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["callgate*"]

[tool.setuptools.package-data]
callgate = ["demo/*.html", "demo/*.js", "demo/*.css"]

[project.optional-dependencies]
verification = ["cryptography==50.0.0"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
observability = ["sentry-sdk>=2,<3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
